# Dependabot (ROADMAP §19, M2-security): weekly grouped updates so dependency
# bumps arrive as small reviewable batches instead of a flood of single PRs.
# The CI audit gate (scripts/security/audit-gate.mjs) stays the hard fail on
# NEW high/critical advisories; Dependabot is the remediation pipeline.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns:
          - "*"
