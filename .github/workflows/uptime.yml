# External uptime watch (2026-08-24): GitHub's runners hit production on a
# schedule; a failed run emails the repo owner. Zero new services — this is
# the watchfulness fix that needs no account.
#
# HONEST CADENCE (2026-09-16): the cron says every 15 minutes. GitHub runs
# schedules best-effort and this one has fired 5–7 times a day since it was
# added — 213 runs in 23 days. Docs and the public /status page must say
# "several times a day", not "every 15 minutes". A real 5-minute watch is
# UptimeRobot (docs/specs/step-13a-deploy.md §1.6), not yet set up; when it
# is, delete this file and rewrite the /status sentence.
#
# It has caught real trouble: 2026-08-26 04:02Z (/readyz) and 16:53Z (/home).
# Every other failure in its history was GitHub refusing to START the job
# during the 2026-09-12..16 Actions-minutes block — not the site.
name: uptime
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API readyz
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://api.withpotion.com/readyz)
          echo "readyz: $code"; test "$code" = "200"
      - name: Dashboard home
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://withpotion.com/home)
          echo "home: $code"; test "$code" = "200"
      # A real completion (2026-09-19). /readyz stayed 200 for ~23 hours while
      # every chat completion returned 503 (the provider key's spend limit was
      # hit by a measurement sweep). Only a request that reaches a model sees
      # that. Needs the POTION_SMOKE_KEY repo secret (a serving key on the
      # potion org); until it is set this step reports and passes.
      - name: Chat completion
        env:
          POTION_SMOKE_KEY: ${{ secrets.POTION_SMOKE_KEY }}
        run: |
          if [ -z "$POTION_SMOKE_KEY" ]; then echo "POTION_SMOKE_KEY secret not set — completion probe skipped"; exit 0; fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' --max-time 60 \
            -H "authorization: Bearer $POTION_SMOKE_KEY" -H 'content-type: application/json' \
            -d '{"model":"potion-auto","max_tokens":8,"messages":[{"role":"user","content":"Reply with the single word ok."}]}' \
            https://api.withpotion.com/v1/chat/completions)
          echo "completion: $code"; head -c 300 /tmp/out.json; echo; test "$code" = "200"
