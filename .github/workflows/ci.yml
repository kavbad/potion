# CI (ROADMAP #29, SPEC §12.9). Single matrix-free job:
#   checkout → node 22 → corepack pnpm 9.15.9 → install (frozen lockfile) →
#   build → typecheck → lint → test (all workspace packages, incl.
#   tests/chaos) → dependency audit gate → CycloneDX SBOM artifact.
# Plus the M2-security gates that already lived here (gitleaks secrets scan).
name: ci

# TRIGGERS (fixed 2026-09-07). These read `branches: [master]`, and this repo
# has no `master` — so this workflow fired on NOTHING. Not "no checks on that
# PR": no checks on any push or any pull request, silently, with an empty
# check list looking much like a passing one.
#
# `pull_request` deliberately carries NO base filter. A base filter is exactly
# how CI stops without saying so: work here is done on branches cut from
# `deploy/**` rather than from the default branch, and a filter naming one
# branch gives a PR into any other branch no CI and no error. Every pull
# request runs it; `push` stays scoped to the branches worth the runner
# minutes on every commit.
on:
  push:
    branches: [main, 'deploy/**']
  pull_request:

# Cancel superseded runs on the same ref (saves runner minutes on rapid pushes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege. Only contents:read is needed: the secrets scan now runs the
# gitleaks binary over the checkout rather than gitleaks-action, so it wants no
# PR metadata and no token at all. pull-requests:read was required only by the
# action, and was dropped with it.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # Least privilege, and `pull-requests: read` is load-bearing: the gitleaks
    # action lists a PR's commits to decide what to scan, and the default token
    # cannot, so the scan died with a 403 rather than a finding. Both this and
    # the missing GITHUB_TOKEN above were invisible for as long as the workflow
    # triggered on a branch that does not exist.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the gitleaks git scan

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # pnpm via corepack, pinned to the version the repo was built with.
      - name: Enable pnpm 9.15.9 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      # pnpm store cache (keyed on the lockfile; restored across runs).
      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # ORDER: cheapest and highest-signal first; every INDEPENDENT check runs
      # even after an earlier failure (2026-09-04, P0.11).
      #
      # It used to read install → gitleaks → build → typecheck → lint → test →
      # audit → SBOM, and steps stop the job on first failure. The secrets scan
      # turned out to be the single most config-fragile step in the file —
      # three separate defects, each findable only by running it — so for three
      # consecutive runs a broken scanner meant NO test signal at all, and the
      # audit gate and SBOM at the tail have never executed once in this
      # repository's life.
      #
      # `if: !cancelled()` on a step means "run unless the job was cancelled" —
      # it still FAILS the job, it just no longer hides everything behind it.
      # Only steps that need nothing from earlier ones get it: build is a real
      # prerequisite (workspace packages resolve through dist/), so typecheck
      # and test stay gated behind it rather than cascading confusing errors.

      # Needs only node_modules, and it is the fastest check in the file (~5s).
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm lint

      # A real prerequisite: typecheck and test resolve workspace deps through
      # dist/, so a failed build makes their output noise, not signal. They
      # therefore gate on THIS STEP specifically — `steps.build.outcome` — and
      # NOT on the default `success()`, which means "every earlier step passed"
      # and would let an unrelated lint error skip the entire test suite. It
      # did exactly that on run 33916899845, one revision of this very block
      # ago: I moved the fragile step first and made lint the new blocker.
      - name: Build
        id: build
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Typecheck
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm typecheck
      # Packages one at a time, not pnpm's default four. Combined with the CI
      # worker cap in vitest.config.ts this keeps the runner inside its process
      # budget; without it the suite fails on whichever test happens to fork
      # when the budget runs out. Wall clock traded for a result that means
      # something. @potion/workers is EXCLUDED here and runs in the `workers`
      # job below — see that job for why.
      - name: Test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        # Coverage rides the ONE suite run CI already does — ~11% slower
        # (packages/db 45s -> 50s), against ~6 minutes for a second pass.
        #
        # The command is the SPLIT one, not `pnpm test`: @potion/workers runs
        # on a runner of its own (see that job) because sharing one exhausted
        # the process budget. That means this job's coverage tree does NOT
        # include workers, and the ratchet below is scoped to match.
        env:
          POTION_COVERAGE: '1'
        run: pnpm --filter '!@potion/workers' -r test && pnpm test:scripts

      # Two-sided, like the escape-hatch ratchet: a fall must be explained, a
      # RISE must be locked in. A number policed in one direction only drifts in
      # the other for free, and then nobody knows what the floor is (P1.4).
      - name: Coverage ratchet
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node scripts/coverage-ratchet.mjs

      # The Python SDK is not a pnpm package, so `pnpm -r test` cannot reach it
      # — it sat outside every repo-level command until 2026-09-05 (P1.2). The
      # first run found the shipped package could not be IMPORTED on a clean
      # install. Independent of the node build, so it reports on its own merits.
      - name: SDK tests (python)
        if: ${{ !cancelled() }}
        run: pnpm test:sdk-python

      # M2-security: secrets gate. Runs the gitleaks BINARY over the full
      # history rather than gitleaks-action, which derives a COMMIT RANGE from
      # the PR and produced four distinct failures here before it ever scanned
      # a byte: wrong branch trigger, missing GITHUB_TOKEN, missing
      # pull-requests:read, and finally
      #
      #   fatal: ambiguous argument '<base>^..<head>': unknown revision
      #   failed to scan Git repository / scanned ~0 bytes
      #
      # because a force-push destroys the base the range was computed from.
      # This branch is rebased constantly, so that is the normal case, not an
      # edge one — and a scanner that fails on git plumbing tells you nothing
      # about secrets either way.
      #
      # `detect` over checkout depth 0 is deterministic, needs no token and no
      # extra permission, and matches what .gitleaks.toml's own header always
      # claimed the CI step did: "runs `gitleaks git` (history)".
      - name: Secrets scan (gitleaks)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          set -euo pipefail
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          # Keep the RELEASE filename: `sha256sum -c` resolves the file named
          # in the manifest line, so renaming the download on the way in makes
          # verification fail with "No such file or directory" — which is
          # exactly what it did on run 33939918635, correctly refusing to run
          # an unverified binary.
          art="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLf -o "$art" "${base}/${art}"
          curl -sSLf -o gitleaks.sums "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Verify before executing: this is the tool that vouches for the
          # repo's secrets, so it does not get to arrive unchecked.
          grep " ${art}\$" gitleaks.sums | sha256sum -c -
          tar -xzf "$art" gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      # Supply-chain gate (M2-security, re-triaged M3 #29): fail on any NEW
      # high/critical production advisory; accepted ones live in
      # scripts/security/audit-allowlist.json (currently EMPTY — re-triage
      # after the next/drizzle-orm bumps). --registry pins the official
      # registry because some mirrors lack an audit endpoint (gate fails CLOSED).
      - name: Dependency audit gate (prod, high+)
        if: ${{ !cancelled() }}
        run: node scripts/security/audit-gate.mjs --audit-level=high --registry=https://registry.npmjs.org

      # CycloneDX SBOM for release provenance (cdxgen pinned via scripts/sbom.sh).
      - name: Generate SBOM (CycloneDX)
        if: ${{ !cancelled() }}
        run: bash scripts/sbom.sh
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: sbom
          path: artifacts/sbom.cyclonedx.json

  # ---------------------------------------------------------------------------
  # @potion/workers, on a runner of its own.
  #
  # Its lab-run tests boot a REAL sandbox — a Python server that forks a shell,
  # which forks git. Sharing a runner with the other twenty-three packages, that
  # fork failed:
  #
  #   __potion_main__.sh: fork: retry: Resource temporarily unavailable
  #   exitCode 254, timedOut false, filesWritten []
  #
  # and the assertion it produced was about a missing output file, three layers
  # from the cause. Tuning did not reach it: the same test passed in one run and
  # failed in the next, and it still failed with the package fully serialized
  # (maxWorkers 1, fileParallelism false) AND nothing else running beside it
  # (--workspace-concurrency=1) — failing 25 minutes into the step, after most
  # of the suite. That is the runner accumulating over the whole job, not test
  # parallelism, and no concurrency setting reaches it.
  #
  # A second runner starts empty. That is the whole fix.
  # ---------------------------------------------------------------------------
  workers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm 9.15.9 (corepack)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: pnpm store cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      # The workers tests import other packages as dist, so the tree is built
      # in runtime-dependency order first (see scripts/build-ordered.mjs).
      - run: pnpm build

      # python3 and git are what the sandbox forks; the test skips itself
      # without them, and a silent skip is the failure mode this job exists to
      # avoid. Fail here instead, where the reason is one line.
      - name: The sandbox needs python3 and git
        run: |
          command -v python3
          command -v git

      - run: pnpm --filter @potion/workers test
