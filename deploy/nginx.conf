# nginx → potion replicas (SPEC §12.8 HA). Default nginx upstream balancing
# is round-robin, so with two entries requests alternate server-a/server-b.
upstream potion_backend {
    server server-a:3000;
    server server-b:3000;
}

server {
    listen 80;

    location / {
        proxy_pass http://potion_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Honor inbound request ids (M3 #26 observability) end-to-end.
        proxy_set_header X-Request-Id $http_x_request_id;
        # Chat completions can be slow with live providers; SSE streams need
        # buffering off and a generous read timeout.
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
    }
}
