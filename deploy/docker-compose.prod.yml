# Potion — SINGLE-INSTANCE production deployment for one design partner.
#
# ─────────────────────────────────────────────────────────────────────────────
#  STOP — DO NOT SCALE THIS PAST ONE SERVER REPLICA.
#
#  `InMemoryRateLimiterStore` is the ONLY implementation of the rate limiter's
#  store seam, and it is what production runs — it is not a test stand-in. With
#  N replicas a key's contracted rate AND daily cap are both N×, and a rollout
#  resets every bucket, so a client can lift its own limit by inducing one
#  (F18). Horizontal scaling requires the G2.5 shared limiter + cache first.
#
#  docker-compose.ha.yml (2 replicas behind nginx) exists for that future and
#  MUST NOT be used until G2.5 lands. See docs/driver-semantics.md row 6 and
#  docs/DEPLOY-RUNBOOK.md.
# ─────────────────────────────────────────────────────────────────────────────
#
# SHAPE (owner decision, 2026-08-10): PostgreSQL is **Neon** (managed,
# off-host); Redis is **co-located** here. That keeps one managed service
# instead of two at this scale, and Neon's branch/PITR restore is the fastest
# path through §3 of the rollback runbook — the step most likely to matter and
# least likely to be practised.
#
# Usage:  docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
# Secrets come from --env-file (root-owned, chmod 600) and are NEVER baked into
# the image. See .env.example for the variable names.

services:
  redis:
    # Present for job DURABILITY, not scale: with the memory queue a restart
    # silently drops queued guarantee:suite-verify work, and the guarantee is
    # the product. F10's idempotency ledger makes a redelivery safe.
    #
    # CO-LOCATED (not managed): its AOF lives in the `redisdata` volume on this
    # host. It holds QUEUE STATE ONLY — no customer evidence, which all lives
    # in Neon — so losing it costs in-flight jobs, not data. Re-enqueue rather
    # than restore.
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - default
      - sandboxnet
    environment:
      # Reasoning models known at boot (2026-08-23): skipped before the call
      # under a small output budget; the server also learns new ones live.
      POTION_REASONING_MODELS: ${POTION_REASONING_MODELS:-}
      # R0 go-live paste point: set these in /opt/potion/.env.prod and the
      # payments transport switches from 'ledger' to Stripe on next deploy.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      POTION_SUPPORT_EMAIL: ${POTION_SUPPORT_EMAIL:-}
      # X1: the code sandbox (internal-only network; unset disables the
      # superpower with a typed note, never a crash).
      POTION_SANDBOX_URL: http://sandbox:8790
      POTION_BROWSER_URL: http://browser:8791
      # NODE_ENV=production flips OFF the dev-auth bypass — real sessions and
      # api keys are required. The Dockerfile runtime stage sets it; repeated
      # here so it is visible at the deployment boundary.
      NODE_ENV: production
      # Neon, from .env.prod. Use the DIRECT (non-pooler) endpoint: this is a
      # single instance with a pool of 10, so Neon's PgBouncer pooler buys
      # nothing and its transaction-mode semantics are a divergence we have
      # not tested. sslmode=require is mandatory.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon direct endpoint, sslmode=require)}
      # Neon autosuspend interacts with two timeouts — see DEPLOY-RUNBOOK §1.
      PG_CONN_TIMEOUT_MS: ${PG_CONN_TIMEOUT_MS:-15000}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      POTION_MASTER_KEY: ${POTION_MASTER_KEY:?set POTION_MASTER_KEY (64 hex, `openssl rand -hex 32`)}
      POTION_OPERATOR_TOKEN: ${POTION_OPERATOR_TOKEN:?set POTION_OPERATOR_TOKEN}
      # Self-serve signup. Default OFF — operator onboarding
      # (docs/ONBOARDING-RUNBOOK.md) is the only way a partner org comes into
      # being unless this is set. It is now passed THROUGH from .env.prod
      # rather than pinned to "": the value was hardcoded, so setting it in
      # the env file did nothing and the flag could not be tested on a real
      # deployment at all.
      # 2026-09-02, operator order ("open it"): self-serve signup is ON —
      # distribution started and the closed gate silently turned away the
      # first real visitor (neutral "check your email", no email ever sent).
      # Delivery is real (Resend); every run keeps its hard dollar cap.
      POTION_SELF_SERVE: ${POTION_SELF_SERVE:-1}
      # STAYS OFF in production (2026-09-02): delivery is real now (Resend),
      # and with self-serve ON this would hand a session link to ANYONE who
      # types an email address — account takeover by email knowledge. Only
      # for closed test deployments with no transport — see
      # apps/server/src/routes/auth.ts.
      POTION_MAGIC_LINK_IN_RESPONSE: ${POTION_MAGIC_LINK_IN_RESPONSE:-}
      # Import the live PLATFORM FRONTIER BASELINE on first boot (default ON
      # for deployments). Without it a fresh database has no live-provenance
      # platform frontier, the provenance guard discards the mock seed, and
      # EVERY request from every org falls through to the default strategy —
      # the auto-switch is absent rather than degraded. Idempotent, and it
      # never clobbers a frontier this deployment already has.
      POTION_PLATFORM_BASELINE: ${POTION_PLATFORM_BASELINE:-1}
      # SERVING-ROADMAP S4 — spending safety on OUR key. Both apply only when
      # provider mode is live AND the org has no BYOK key of its own.
      #   ORG cap defaults ON ($10/org/month): an org with no budget row of
      #     its own was previously unbounded on the platform key.
      #   DAILY cap defaults OFF: a global ceiling stops ALL serving at once,
      #     so it is a number the operator chooses deliberately. Set it.
      POTION_PLATFORM_ORG_CAP_USD: ${POTION_PLATFORM_ORG_CAP_USD:-10}
      POTION_PLATFORM_DAILY_CAP_USD: ${POTION_PLATFORM_DAILY_CAP_USD:-}
      POTION_METRICS: ${POTION_METRICS:-1}
      # G0.5: the default clustering threshold is MOCK-tuned (0.62). With a
      # real embedder it must be 0.2 — the walkthrough prints this warning at
      # every run and it is a real production trap.
      POTION_CLUSTER_THRESHOLD: ${POTION_CLUSTER_THRESHOLD:-0.2}
      POTION_EMBEDDER: ${POTION_EMBEDDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # P1-3: where the job handlers run. UNSET (the default) = in-process,
      # which is right on one box. Set POTION_WORKER=off in .env.prod AND
      # start the `worker` service below (`--profile split`) to give
      # background work its own event loop, heap and fate. Empty is treated
      # as unset by the server, so a scaffolded-empty line cannot silently
      # stop every job (the 2026-08-27 class).
      #
      # OFF WITHOUT A WORKER RUNNING IS A HAZARD: with Redis present the boot
      # gate cannot tell "a worker is coming" from "nobody is consuming", so
      # jobs would pile up in Redis unnoticed. After flipping it, check
      # `docker compose ps worker`. Off with the MEMORY driver refuses to boot.
      POTION_WORKER: ${POTION_WORKER:-}
      # 13a spec §2 gap 1: lab:run THROWS without it. Loopback while the
      # worker is in-process; in a split deployment the worker reaches the
      # server by service name, which is why the worker service below sets
      # its own POTION_SERVING_URL.
      POTION_SERVING_URL: ${POTION_SERVING_URL:-http://localhost:3000}
      # 13a spec §2 gap 2 + deploy plan D2: the public API origin — docs
      # snippets, Lab links and OAuth callbacks derive from it. Behind Caddy
      # the request Host is the container's, so this must be pinned.
      POTION_PUBLIC_URL: ${POTION_PUBLIC_URL:?set POTION_PUBLIC_URL (https://api.<domain>)}
      # Magic-link delivery (apps/server/src/email.ts). Both unset → links are only logged/hand-delivered.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POTION_EMAIL_FROM: ${POTION_EMAIL_FROM:-}
      POTION_EMAIL_REPLY_TO: ${POTION_EMAIL_REPLY_TO:-}
      # The serving price table MUST be the one the committed baseline frontiers
      # were measured against (prices_version 2026-08-04-or2+tranche-2026-08-19);
      # the repo-root prices.json is the pre-tranche curated table and does not
      # know the measured roster — caught in the Phase D rehearsal (503 on route).
      POTION_PRICES_PATH: /app/.tranche/prices.json
      POTION_APP_URL: ${POTION_APP_URL:?set POTION_APP_URL (https://app.<domain>)}
      # SIGN IN WITH GOOGLE (2026-09-04). Unset → the /auth/google/* routes
      # are never registered and /auth/providers reports google:false, so
      # the login page simply does not draw the button. The redirect URI is
      # derived from POTION_APP_URL above (…/api/auth/google/callback) —
      # override only if the console has a different one registered.
      # See docs/GOOGLE-SIGNIN.md for the console steps.
      POTION_GOOGLE_CLIENT_ID: ${POTION_GOOGLE_CLIENT_ID:-}
      POTION_GOOGLE_CLIENT_SECRET: ${POTION_GOOGLE_CLIENT_SECRET:-}
      POTION_GOOGLE_REDIRECT_URI: ${POTION_GOOGLE_REDIRECT_URI:-}
      # The learning period runs in-process here; a customer's audit must never run on mock providers
      POTION_EVAL_PROVIDER: live
      # 2026-09-01 (external review P0, confirmed): research cycles fell
      # back to the MOCK world on prod because only EVAL was set — prod
      # research measures the real world, bounded by the live cycle cap.
      POTION_RESEARCH_PROVIDER: live
      # 13a spec §1.6: error reporting. Unset → the init is a no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: "3000"
      # F4 (docs/RESEARCH-OPS.md): the Frontier Notes clock — the Tuesday
      # draft→verify→gate→publish chain as an in-server tick. The defaults
      # below ARM it (they are content-addressed worker ids and a mount
      # path, not secrets) so an .env.prod reset can never silently disarm
      # the institution — found live 2026-09-03 when an alignment deploy
      # replaced the env file and the clock went dark. Promote a new
      # generation by updating the committed default (or overriding in
      # .env.prod); set POTION_RESEARCH_DIR empty to disarm deliberately.
      POTION_RESEARCH_DIR: ${POTION_RESEARCH_DIR:-/research}
      POTION_RESEARCH_ORG: ${POTION_RESEARCH_ORG:-org-research}
      POTION_RESEARCH_DELTA_HARNESS: ${POTION_RESEARCH_DELTA_HARNESS:-8aec3d6c5a07825815f9057c9987072397dd188cef9187347e6157f0b83429b9}
      POTION_RESEARCH_AUDITOR_HARNESS: ${POTION_RESEARCH_AUDITOR_HARNESS:-03ba206596c75edfcc888f5a093c0214428141fdfdff2a8893f4fe98757cc06a}
      # F5 — THE MEASUREMENT LANE SPENDS REAL MONEY and is therefore
      # DISARMED unless this carries a date (the same dated risk-acceptance
      # scripts/observatory-week.ts demands by hand). Deliberately NOT
      # defaulted: the clock's ON state is safe to commit, spending is not.
      # Set POTION_OBSERVATORY_ARM=YYYY-MM-DD in .env.prod to arm Mondays.
      POTION_OBSERVATORY_ARM: ${POTION_OBSERVATORY_ARM:-}
      # F6: the DAILY framing generation (scripts/delta-daily-hire.ts).
      # Unset = the code-composed ledger publishes unframed — still a post
      # every day, just without the model's plain-words opening.
      # Committed defaults like the weekly pair above: an .env.prod replacement
      # silently DISARMED the daily verifier once (the value was "" — and ""
      # is not unset to `??`; the clock now treats blank as absent either way).
      # Daily writer: scripts/delta-piece-hire.ts (hired 2026-09-05).
      # Daily verifier: scripts/auditor-piece-hire.ts (hired 2026-09-05,
      # wired 2026-09-10; dial with POST /api/lab/harnesses/<hash>/dial
      # {"slot":"brain","qualityIndex":2} and promote the new hash here).
      POTION_RESEARCH_DELTA_DAILY_HARNESS: ${POTION_RESEARCH_DELTA_DAILY_HARNESS:-08a81fd40b46a13f77cb9655dbad10dc5b34a53661365bf08cc18113c92ee1ef}
      POTION_RESEARCH_AUDITOR_DAILY_HARNESS: ${POTION_RESEARCH_AUDITOR_DAILY_HARNESS:-a8ae19dde6f5695b400df46255dd432494ac1d59c8dbe0b4cafd434b5cb29100}
    # F4: the research mount (rw — the clock writes notes + its state files;
    # the dashboard keeps its own ro mount of artifacts/notes).
    volumes:
      - /opt/potion/research:/research
    # NOTE: no `ports:` — the server is reachable ONLY through Caddy. This is
    # what makes /metrics network-restricted in fact rather than by assertion
    # (route-inventory.ts classifies it public with exactly that justification).
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /readyz, NOT /healthz: db ping + queue ping + breaker summary.
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  browser:
    # X6 (2026-08-30): the browser hand — headless Chromium behind a minimal
    # HTTP service. Needs EGRESS to browse (default network, unlike the
    # sandbox); containment is the in-process per-request SSRF guard
    # (browser_server.mjs aborts private/loopback/metadata addresses on
    # every request the page makes) plus the caps below. Only the server
    # reaches it; every act it performs was pore-gated upstream.
    build:
      context: ./browser
    restart: unless-stopped
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 512
    shm_size: 512m
    tmpfs:
      - /tmp:size=512m

  sandbox:
    # X1 (2026-08-28): the code-execution sandbox. INTERNAL-ONLY network —
    # `sandboxnet` has internal: true, so this container has NO route out:
    # model-written code can compute but cannot reach the world. Non-root
    # user, per-exec resource caps inside (deploy/sandbox/sandbox_server.py).
    # Only the server can reach it; it can reach nothing.
    build:
      context: ./sandbox
    restart: unless-stopped
    networks:
      - sandboxnet
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m

  dashboard:
    # Deploy plan D1. SAME IMAGE as the server — the build stage compiles the
    # whole pnpm workspace, `next build` included — with the command swapped
    # to Next's production server. Every partner-facing surface (landing,
    # docs, keys UI, usage, /build) lives here; without this service the
    # deploy has an API and no product.
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/dashboard
    command: ["sh", "-c", "./node_modules/.bin/next start -p 3001"]
    environment:
      NODE_ENV: production
      # Server-side fetches (lib/api.ts) go over the compose network; the
      # browser never needs this value.
      POTION_API_URL: http://server:3000
      POTION_APP_URL: ${POTION_APP_URL:?set POTION_APP_URL (https://app.<domain>)}
      # Frontier Notes issues, written by the observatory service (read-only here)
      FRONTIER_NOTES_DIR: /research/notes
      # 'Ask the docs' (public, rate-limited) runs on the org's own serving key through the internal API
      POTION_SELF_KEY: ${POTION_SELF_KEY:-}
      POTION_API_URL_PUBLIC: http://server:3000
      POTION_PUBLIC_API_URL: https://api.withpotion.com
      DOCS_ASK_DAILY_MAX: ${DOCS_ASK_DAILY_MAX:-500}
    # No ports: reachable only through Caddy, same posture as the server.
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # /home is the public landing page: session-free, no API dependency —
      # exactly the surface that must never 500 for an anonymous visitor.
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3001/home').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - /opt/potion/research/artifacts/notes:/research/notes:ro

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Deploy plan D2: two vhosts. Local rehearsal values: api.localhost /
      # app.localhost (Caddy issues internal certs for *.localhost).
      POTION_API_SITE: ${POTION_API_SITE:?set POTION_API_SITE (api.<domain>)}
      POTION_APP_SITE: ${POTION_APP_SITE:?set POTION_APP_SITE (app.<domain>)}
      POTION_ROOT_SITE: ${POTION_ROOT_SITE:?set POTION_ROOT_SITE (<domain>, bare)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      server:
        condition: service_started
      dashboard:
        condition: service_started

  # ---- The Observatory (docs/OBSERVATORY.md) — weekly, one-shot, profile-gated ----
  # Never started by `up -d`; the host cron runs it Mondays:
  #   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod \
  #     --profile observatory run --rm observatory
  # Runs against the RESEARCH store under /opt/potion/research, never the
  # serving database. Spend is governed by the script's own $50/month envelope
  # (ledger in /research/artifacts/ledger.jsonl) on top of the harness belt.
  observatory:
    profiles: ["observatory"]
    image: deploy-server
    working_dir: /app
    command: ["node_modules/.bin/tsx", "scripts/observatory-week.ts"]
    environment:
      OBSERVATORY_DB: /research/store
      OBSERVATORY_ARTIFACTS: /research/artifacts
      POTION_PRICES_PATH: /app/prices.json
      POTION_EVAL_PROVIDER: live
      POTION_RESEARCH_PROVIDER: live
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      # The operator's standing grant (2026-08-22): $50/month, ledgered.
      KEY_RISK_ACCEPTED: "2026-08-22"
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_PAGE_ID: ${NOTION_PAGE_ID:-}
      # Frontier Notes (docs/FRONTIER-NOTES.md): weekly issue written after the run
      POTION_APP_URL: ${POTION_APP_URL:-https://app.withpotion.com}
      FRONTIER_NOTES_WRITER: ${FRONTIER_NOTES_WRITER:-or-sonnet}
      FRONTIER_NOTES_BYLINE: ${FRONTIER_NOTES_BYLINE:-Potion Research}
      FRONTIER_NOTES_GATE: ${FRONTIER_NOTES_GATE:-}
      FRONTIER_NOTES_NEVER_NAME: ${FRONTIER_NOTES_NEVER_NAME:-}
      # Dogfood: Frontier Notes is written through Potion's own serving API
      POTION_API_URL: http://server:3000
      POTION_SELF_KEY: ${POTION_SELF_KEY:-}
      FRONTIER_NOTES_POLICY: ${FRONTIER_NOTES_POLICY:-frontier-notes-writer}
      FRONTIER_NOTES_CLUSTER: ${FRONTIER_NOTES_CLUSTER:-creative}
      NODE_ENV: production
    volumes:
      - /opt/potion/research:/research
    restart: "no"

  # ---- P1-3: the job half, as its own process (opt-in) ----------------------
  # `docker compose --profile split up -d worker`, with POTION_WORKER=off set
  # for the server. Without the profile this service does not exist, so the
  # default deployment is byte-identical to before.
  #
  # Same image, same entry wiring: apps/server/src/worker.ts builds the SAME
  # context the server builds (same db, same resolved prices path, same
  # dimension-guarded embedder) and calls the SAME startPotionWorker. A worker
  # that resolved any of those differently would be the prices.json
  # contamination class again.
  #
  # REQUIRES the bullmq driver — REDIS_URL below is what makes the queue
  # something two processes can share. It is not on sandboxnet: the sandbox is
  # reached by the SERVER, not by job handlers.
  worker:
    profiles: ["split"]
    image: deploy-server
    working_dir: /app
    command: ["node", "apps/server/dist/worker.js"]
    restart: unless-stopped
    networks:
      - default
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon direct endpoint, sslmode=require)}
      PG_CONN_TIMEOUT_MS: ${PG_CONN_TIMEOUT_MS:-15000}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      POTION_MASTER_KEY: ${POTION_MASTER_KEY:?set POTION_MASTER_KEY (64 hex, `openssl rand -hex 32`)}
      # The SAME measured price table the server serves from — a worker on a
      # different table promotes against evidence the server never priced.
      POTION_PRICES_PATH: /app/.tranche/prices.json
      POTION_CLUSTER_THRESHOLD: ${POTION_CLUSTER_THRESHOLD:-0.2}
      POTION_EMBEDDER: ${POTION_EMBEDDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Not loopback: in a split deployment lab:run reaches the SERVER.
      POTION_SERVING_URL: http://server:3000
      POTION_PUBLIC_URL: ${POTION_PUBLIC_URL:?set POTION_PUBLIC_URL (https://api.<domain>)}
      POTION_APP_URL: ${POTION_APP_URL:?set POTION_APP_URL (https://app.<domain>)}
      # Alert rules deliver mail from whichever process dispatches them.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      POTION_EMAIL_FROM: ${POTION_EMAIL_FROM:-}
      POTION_EMAIL_REPLY_TO: ${POTION_EMAIL_REPLY_TO:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      redis:
        condition: service_started

networks:
  # X1: the sandbox's world — internal: true means NO egress; only members
  # of this network can talk to the sandbox, and it can reach nothing else.
  sandboxnet:
    internal: true

volumes:
  redisdata:
  caddydata:
  caddyconfig:
