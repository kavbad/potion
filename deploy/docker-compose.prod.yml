# Potion — SINGLE-INSTANCE production deployment for one design partner.
#
# ─────────────────────────────────────────────────────────────────────────────
#  STOP — DO NOT SCALE THIS PAST ONE SERVER REPLICA.
#
#  `InMemoryRateLimiterStore` is the ONLY implementation of the rate limiter's
#  store seam, and it is what production runs — it is not a test stand-in. With
#  N replicas a key's contracted rate AND daily cap are both N×, and a rollout
#  resets every bucket, so a client can lift its own limit by inducing one
#  (F18). Horizontal scaling requires the G2.5 shared limiter + cache first.
#
#  docker-compose.ha.yml (2 replicas behind nginx) exists for that future and
#  MUST NOT be used until G2.5 lands. See docs/driver-semantics.md row 6 and
#  docs/DEPLOY-RUNBOOK.md.
# ─────────────────────────────────────────────────────────────────────────────
#
# SHAPE (owner decision, 2026-08-10): PostgreSQL is **Neon** (managed,
# off-host); Redis is **co-located** here. That keeps one managed service
# instead of two at this scale, and Neon's branch/PITR restore is the fastest
# path through §3 of the rollback runbook — the step most likely to matter and
# least likely to be practised.
#
# Usage:  docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod up -d --build
# Secrets come from --env-file (root-owned, chmod 600) and are NEVER baked into
# the image. See .env.example for the variable names.

services:
  redis:
    # Present for job DURABILITY, not scale: with the memory queue a restart
    # silently drops queued guarantee:suite-verify work, and the guarantee is
    # the product. F10's idempotency ledger makes a redelivery safe.
    #
    # CO-LOCATED (not managed): its AOF lives in the `redisdata` volume on this
    # host. It holds QUEUE STATE ONLY — no customer evidence, which all lives
    # in Neon — so losing it costs in-flight jobs, not data. Re-enqueue rather
    # than restore.
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # NODE_ENV=production flips OFF the dev-auth bypass — real sessions and
      # api keys are required. The Dockerfile runtime stage sets it; repeated
      # here so it is visible at the deployment boundary.
      NODE_ENV: production
      # Neon, from .env.prod. Use the DIRECT (non-pooler) endpoint: this is a
      # single instance with a pool of 10, so Neon's PgBouncer pooler buys
      # nothing and its transaction-mode semantics are a divergence we have
      # not tested. sslmode=require is mandatory.
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (Neon direct endpoint, sslmode=require)}
      # Neon autosuspend interacts with two timeouts — see DEPLOY-RUNBOOK §1.
      PG_CONN_TIMEOUT_MS: ${PG_CONN_TIMEOUT_MS:-15000}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      QUEUE_DRIVER: bullmq
      POTION_MASTER_KEY: ${POTION_MASTER_KEY:?set POTION_MASTER_KEY (64 hex, `openssl rand -hex 32`)}
      POTION_OPERATOR_TOKEN: ${POTION_OPERATOR_TOKEN:?set POTION_OPERATOR_TOKEN}
      # Self-serve signup. Default OFF — operator onboarding
      # (docs/ONBOARDING-RUNBOOK.md) is the only way a partner org comes into
      # being unless this is set. It is now passed THROUGH from .env.prod
      # rather than pinned to "": the value was hardcoded, so setting it in
      # the env file did nothing and the flag could not be tested on a real
      # deployment at all.
      POTION_SELF_SERVE: ${POTION_SELF_SERVE:-}
      # There is no SMTP. With self-serve ON this returns the magic link in
      # the signup response so the flow can complete; without it the link
      # only reaches the server log and nobody can sign in. Closed test
      # deployments only — see apps/server/src/routes/auth.ts.
      POTION_MAGIC_LINK_IN_RESPONSE: ${POTION_MAGIC_LINK_IN_RESPONSE:-}
      # Import the live PLATFORM FRONTIER BASELINE on first boot (default ON
      # for deployments). Without it a fresh database has no live-provenance
      # platform frontier, the provenance guard discards the mock seed, and
      # EVERY request from every org falls through to the default strategy —
      # the auto-switch is absent rather than degraded. Idempotent, and it
      # never clobbers a frontier this deployment already has.
      POTION_PLATFORM_BASELINE: ${POTION_PLATFORM_BASELINE:-1}
      # SERVING-ROADMAP S4 — spending safety on OUR key. Both apply only when
      # provider mode is live AND the org has no BYOK key of its own.
      #   ORG cap defaults ON ($10/org/month): an org with no budget row of
      #     its own was previously unbounded on the platform key.
      #   DAILY cap defaults OFF: a global ceiling stops ALL serving at once,
      #     so it is a number the operator chooses deliberately. Set it.
      POTION_PLATFORM_ORG_CAP_USD: ${POTION_PLATFORM_ORG_CAP_USD:-10}
      POTION_PLATFORM_DAILY_CAP_USD: ${POTION_PLATFORM_DAILY_CAP_USD:-}
      POTION_METRICS: ${POTION_METRICS:-1}
      # G0.5: the default clustering threshold is MOCK-tuned (0.62). With a
      # real embedder it must be 0.2 — the walkthrough prints this warning at
      # every run and it is a real production trap.
      POTION_CLUSTER_THRESHOLD: ${POTION_CLUSTER_THRESHOLD:-0.2}
      POTION_EMBEDDER: ${POTION_EMBEDDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # 13a spec §2 gap 1: lab:run THROWS without it; loopback because the
      # worker is in-process with the server.
      POTION_SERVING_URL: ${POTION_SERVING_URL:-http://localhost:3000}
      # 13a spec §2 gap 2 + deploy plan D2: the public API origin — docs
      # snippets, Lab links and OAuth callbacks derive from it. Behind Caddy
      # the request Host is the container's, so this must be pinned.
      POTION_PUBLIC_URL: ${POTION_PUBLIC_URL:?set POTION_PUBLIC_URL (https://api.<domain>)}
      # The serving price table MUST be the one the committed baseline frontiers
      # were measured against (prices_version 2026-08-04-or2+tranche-2026-08-19);
      # the repo-root prices.json is the pre-tranche curated table and does not
      # know the measured roster — caught in the Phase D rehearsal (503 on route).
      POTION_PRICES_PATH: /app/.tranche/prices.json
      POTION_APP_URL: ${POTION_APP_URL:?set POTION_APP_URL (https://app.<domain>)}
      # 13a spec §1.6: error reporting. Unset → the init is a no-op.
      SENTRY_DSN: ${SENTRY_DSN:-}
      PORT: "3000"
    # NOTE: no `ports:` — the server is reachable ONLY through Caddy. This is
    # what makes /metrics network-restricted in fact rather than by assertion
    # (route-inventory.ts classifies it public with exactly that justification).
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # /readyz, NOT /healthz: db ping + queue ping + breaker summary.
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  dashboard:
    # Deploy plan D1. SAME IMAGE as the server — the build stage compiles the
    # whole pnpm workspace, `next build` included — with the command swapped
    # to Next's production server. Every partner-facing surface (landing,
    # docs, keys UI, usage, /build) lives here; without this service the
    # deploy has an API and no product.
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app/apps/dashboard
    command: ["sh", "-c", "./node_modules/.bin/next start -p 3001"]
    environment:
      NODE_ENV: production
      # Server-side fetches (lib/api.ts) go over the compose network; the
      # browser never needs this value.
      POTION_API_URL: http://server:3000
      POTION_APP_URL: ${POTION_APP_URL:?set POTION_APP_URL (https://app.<domain>)}
    # No ports: reachable only through Caddy, same posture as the server.
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      # /home is the public landing page: session-free, no API dependency —
      # exactly the surface that must never 500 for an anonymous visitor.
      test:
        - CMD-SHELL
        - node -e "fetch('http://localhost:3001/home').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Deploy plan D2: two vhosts. Local rehearsal values: api.localhost /
      # app.localhost (Caddy issues internal certs for *.localhost).
      POTION_API_SITE: ${POTION_API_SITE:?set POTION_API_SITE (api.<domain>)}
      POTION_APP_SITE: ${POTION_APP_SITE:?set POTION_APP_SITE (app.<domain>)}
      POTION_ROOT_SITE: ${POTION_ROOT_SITE:?set POTION_ROOT_SITE (<domain>, bare)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      server:
        condition: service_started
      dashboard:
        condition: service_started

  # ---- The Observatory (docs/OBSERVATORY.md) — weekly, one-shot, profile-gated ----
  # Never started by `up -d`; the host cron runs it Mondays:
  #   docker compose -f deploy/docker-compose.prod.yml --env-file .env.prod \
  #     --profile observatory run --rm observatory
  # Runs against the RESEARCH store under /opt/potion/research, never the
  # serving database. Spend is governed by the script's own $50/month envelope
  # (ledger in /research/artifacts/ledger.jsonl) on top of the harness belt.
  observatory:
    profiles: ["observatory"]
    image: deploy-server
    working_dir: /app
    command: ["node_modules/.bin/tsx", "scripts/observatory-week.ts"]
    environment:
      OBSERVATORY_DB: /research/store
      OBSERVATORY_ARTIFACTS: /research/artifacts
      POTION_PRICES_PATH: /app/prices.json
      POTION_EVAL_PROVIDER: live
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY}
      # The operator's standing grant (2026-08-22): $50/month, ledgered.
      KEY_RISK_ACCEPTED: "2026-08-22"
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_PAGE_ID: ${NOTION_PAGE_ID:-}
      NODE_ENV: production
    volumes:
      - /opt/potion/research:/research
    restart: "no"

volumes:
  redisdata:
  caddydata:
  caddyconfig:
