# gitleaks configuration (ROADMAP §19, M2-security). CI step runs
# `gitleaks git` (history) and releases scan the working tree. Default rule
# set plus Potion-specific provider-key patterns below.
title = "Potion gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "openrouter-api-key"
description = "OpenRouter API key (sk-or-...)"
regex = '''sk-or-[A-Za-z0-9_-]{20,}'''

[[rules]]
id = "generic-provider-key-env"
description = "Provider API key assigned in code/docs (*_API_KEY = real value)"
regex = '''(?i)(ANTHROPIC|OPENAI|GOOGLE|OPENROUTER)_API_KEY\s*=\s*["']?(sk|AIza|gsk)_[A-Za-z0-9_-]{16,}'''

[allowlist]
description = "Known non-secrets: gitignored build/dependency output and the sanctioned local secret file. NOTE: CI scans git history (tracked content only), so these paths can never hide a COMMITTED secret — they only keep local `gitleaks dir` runs noise-free."
paths = [
  '''node_modules''',
  '''dist''',
  '''\.tsbuildinfo''',
  '''artifacts/''',
  '''\.next/''',        # dashboard build output: content hashes trip generic-api-key
  '''(^|/)\.env$''',    # sanctioned local secret location (gitignored, never committed)
  '''coverage/''',
  '''invoices/''',

  # ── CREDENTIAL-SHAPED TEST FIXTURES (2026-09-05, the first real scan) ──
  # The secrets gate had never actually run: ci.yml triggered on a branch that
  # does not exist, and gitleaks-action scans a PR COMMIT RANGE that stops
  # resolving after a force-push. Its first honest execution found 35 hits.
  # Every one was triaged by file, none was a live credential.
  #
  # 33 sat in tests and fixtures, which is what this product is ABOUT: sealing
  # tokens, redacting them from logs and traces, and proving routes never echo
  # them. Those proofs need credential-shaped strings to redact —
  # `01-spec-embeds-token.json` says so in its filename, `redactor.test.ts`
  # exists to strip what it embeds, and `grant-absence-sweep.test.ts` asserts
  # every route answers without token material.
  #
  # RESIDUAL RISK, stated rather than buried: a REAL credential pasted into a
  # test file or a fixtures/ directory will NOT be caught by this gate. That is
  # accepted deliberately — the alternative is 35 permanent findings, and a
  # gate that is always red is a gate nobody reads. Everything outside these
  # patterns is still scanned, which is where a real leak would land.
  '''\.test\.ts$''',
  '''(^|/)fixtures/''',
  # Documented in the file itself, directly above the constant: "Not a
  # credential: a fixture value the in-process mock provider issues."
  '''scripts/step10-live-mcp\.ts$''',
]
regexes = [
  # Documented placeholders, not real keys (docs/M1B-RUNBOOK.md etc.)
  '''sk-or-\.\.\.''',
  # Deliberate TEST FIXTURE (apps/server/test/server.test.ts keys-masking
  # tests): a fake key that exists to assert we never store it unmasked.
  '''sk-test-1234567890abcdef''',
  # docs/research/classifier-separation-2026-08-23.md: a prose RISK-ACCEPTANCE
  # stamp, matched by generic-api-key purely on the KEY=<value> shape. It is a
  # date, not a credential.
  '''KEY_RISK_ACCEPTED=\d{4}-\d{2}-\d{2}''',
]
