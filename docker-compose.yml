# Local dev services for Potion (SPEC §10).
# Sandbox/gates use PGlite + memory queue instead — this file is for the user's local run.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: potion
      POSTGRES_PASSWORD: potion
      POSTGRES_DB: potion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potion -d potion"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # M3 #28: MinIO — S3-compatible artifact store backend (packages/artifacts,
  # ARTIFACT_STORE=s3, forcePathStyle). minio-mc initializes the bucket once.
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: potion
      MINIO_ROOT_PASSWORD: potion-minio
    ports:
      - "9000:9000"   # S3 API (S3_ENDPOINT=http://localhost:9000)
      - "9001:9001"   # console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 potion potion-minio
        mc mb --ignore-existing local/potion-artifacts
        mc anonymous set download local/potion-artifacts
    restart: "no"

volumes:
  pgdata:
  redisdata:
  miniodata:
